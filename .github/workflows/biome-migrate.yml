name: Biome migrate

on:
  push:
    branches: [master]
    paths:
      - "package-lock.json"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.REPO_HOUSEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.REPO_HOUSEKEEPER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run biome migrate
        run: npx biome migrate --write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/biome-migrate
          delete-branch: true
          commit-message: "chore: run biome migrate"
          title: "chore: run biome migrate"
          body: |
            Diff produced by running `biome migrate --write` to keep the configuration in sync with the installed `@biomejs/biome` version.
          labels: auto-merge
