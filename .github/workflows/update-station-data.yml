name: Update Station Data

on:
  schedule:
    # Run every Monday at 00:00 UTC (09:00 JST)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.STATION_UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.STATION_UPDATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate station data
        run: npm run generate:stations

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          add-paths: data/
          commit-message: "Update station data"
          branch: bot/update-station-data
          title: "Update station data"
          labels: auto-merge
          token: ${{ steps.app-token.outputs.token }}
