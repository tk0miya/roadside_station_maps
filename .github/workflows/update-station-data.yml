name: Update Station Data

on:
  schedule:
    # Run every Monday at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ vars.STATION_UPDATE_CLIENT_ID }}
        private-key: ${{ secrets.STATION_UPDATE_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate station data
      run: npm run generate:stations

    - name: Create pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        add-paths: data/
        commit-message: "Update station data"
        branch: bot/update-station-data
        title: "Update station data"
        labels: auto-merge
        token: ${{ steps.app-token.outputs.token }}

